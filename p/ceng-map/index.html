<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Interactive Course Map</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h2>Carleton Engineering Progression Map</h2>
    <p>A small tool to easily design and manipulate program progression trees, complete with credit counting.</p>

    <div class="controls">
        <select id="map-selector" onchange="if(this.value) loadPredefinedMap(this.value)" class="map-dropdown">
            <option value="maps/default.json">Electrical Engineering (Default)</option>
            <option value="maps/cursed-elec-phys-minor.json">Cursed Electrical w/ Physics Minor</option>
        </select>

        <button type="button" onclick="saveJSON(event)">Save Custom Map</button>
        <label class="file-upload">
            Load Custom Map
            <input type="file" id="load-file" accept=".json" style="display: none;" onchange="loadCustomJSON(event)">
        </label>
    </div>

    <div id="course-network"></div>

    <div id="context-menu" class="context-menu" style="display: none;">
        <ul id="context-menu-list"></ul>
    </div>

    <div id="course-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">Add Course</h3>
            <div class="modal-field">
                <label>Course Code:</label>
                <input type="text" id="modal-code" placeholder="e.g. MATH 1004">
            </div>
            <div class="modal-field">
                <label>Course Name (Optional):</label>
                <input type="text" id="modal-name" placeholder="e.g. Calculus">
            </div>
            <div class="modal-field">
                <label>Credits:</label>
                <input type="number" id="modal-credits" step="0.25" value="0.5">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-save" onclick="saveCourseModal()">Save</button>
                <button type="button" class="btn-cancel" onclick="closeCourseModal()">Cancel</button>
            </div>
        </div>
    </div>

    <input type="color" id="node-color-picker" style="display: none;">

    <script src="backend.js"></script>

</body>

</html>
